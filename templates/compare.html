<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Users - Timesheet</title>
    <script>
        (function () {
            var t = localStorage.getItem('theme') || 'dark';
            if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
        })();
    </script>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/theme.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <button type="button" class="theme-toggle" onclick="toggleTheme()">
                <span class="theme-icon"></span><span class="theme-text"></span>
            </button>
            <a class="back-link" href="/">&larr; Back to dashboard</a>
            <h1>Compare Users</h1>
            <p class="subtitle">Select users to compare their activities and working hours</p>
        </div>
    </header>

    <main class="container">
        <section class="panel">
            <h2 class="panel-title">Choose users</h2>
            <form method="get" action="/compare/results" id="compare-form">
                <div class="select-row">
                    <div class="select-field">
                        <label for="user1">User 1</label>
                        <select name="users" id="user1" required>
                            <option value="" disabled {{ '' if selected_ids|length > 0 else 'selected' }}>Select a user</option>
                            {% for u in all_users %}
                            <option value="{{ u.id }}" {{ 'selected' if selected_ids|length > 0 and u.id == selected_ids[0] else '' }}>{{ u.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <span class="vs-badge">vs</span>

                    <div class="select-field">
                        <label for="user2">User 2</label>
                        <select name="users" id="user2" required>
                            <option value="" disabled {{ '' if selected_ids|length > 1 else 'selected' }}>Select a user</option>
                            {% for u in all_users %}
                            <option value="{{ u.id }}" {{ 'selected' if selected_ids|length > 1 and u.id == selected_ids[1] else '' }}>{{ u.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn-primary" style="margin-top:18px;">Compare &rarr;</button>
            </form>
        </section>
    </main>
</body>
</html>
